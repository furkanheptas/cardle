<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayrak Tahmin Oyunu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .score {
            text-align: center;
            font-size: 1.2em;
            color: #667eea;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .flag-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .flag {
            width: 300px;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .option-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .option-btn.correct {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .option-btn.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .feedback {
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            min-height: 40px;
            margin-bottom: 20px;
        }

        .feedback.correct {
            color: #4CAF50;
        }

        .feedback.wrong {
            color: #f44336;
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .next-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .next-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .game-over {
            text-align: center;
        }

        .game-over h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .game-over p {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Bayrak Tahmin Oyunu</h1>
        <div class="score">Skor: <span id="score">0</span> / <span id="total">0</span></div>
        
        <div id="game-area">
            <div class="flag-container">
                <div class="flag" id="flag"></div>
            </div>
            
            <div class="feedback" id="feedback"></div>
            
            <div class="options" id="options"></div>
            
            <button class="next-btn" id="next-btn" disabled>Sonraki Soru</button>
        </div>
    </div>

    <script>
        const countries = [
            { name: "Türkiye", flag: "https://flagcdn.com/w320/tr.png" },
            { name: "Amerika Birleşik Devletleri", flag: "https://flagcdn.com/w320/us.png" },
            { name: "Almanya", flag: "https://flagcdn.com/w320/de.png" },
            { name: "Fransa", flag: "https://flagcdn.com/w320/fr.png" },
            { name: "İngiltere", flag: "https://flagcdn.com/w320/gb.png" },
            { name: "İtalya", flag: "https://flagcdn.com/w320/it.png" },
            { name: "İspanya", flag: "https://flagcdn.com/w320/es.png" },
            { name: "Japonya", flag: "https://flagcdn.com/w320/jp.png" },
            { name: "Çin", flag: "https://flagcdn.com/w320/cn.png" },
            { name: "Brezilya", flag: "https://flagcdn.com/w320/br.png" },
            { name: "Arjantin", flag: "https://flagcdn.com/w320/ar.png" },
            { name: "Kanada", flag: "https://flagcdn.com/w320/ca.png" },
            { name: "Avustralya", flag: "https://flagcdn.com/w320/au.png" },
            { name: "Rusya", flag: "https://flagcdn.com/w320/ru.png" },
            { name: "Meksika", flag: "https://flagcdn.com/w320/mx.png" },
            { name: "Yunanistan", flag: "https://flagcdn.com/w320/gr.png" },
            { name: "Hollanda", flag: "https://flagcdn.com/w320/nl.png" },
            { name: "İsveç", flag: "https://flagcdn.com/w320/se.png" },
            { name: "Norveç", flag: "https://flagcdn.com/w320/no.png" },
            { name: "Portekiz", flag: "https://flagcdn.com/w320/pt.png" },
            { name: "Güney Kore", flag: "https://flagcdn.com/w320/kr.png" },
            { name: "Hindistan", flag: "https://flagcdn.com/w320/in.png" },
            { name: "Suudi Arabistan", flag: "https://flagcdn.com/w320/sa.png" },
            { name: "Mısır", flag: "https://flagcdn.com/w320/eg.png" },
            { name: "Belçika", flag: "https://flagcdn.com/w320/be.png" },
            { name: "İsviçre", flag: "https://flagcdn.com/w320/ch.png" },
            { name: "Polonya", flag: "https://flagcdn.com/w320/pl.png" },
            { name: "Ukrayna", flag: "https://flagcdn.com/w320/ua.png" },
            { name: "Güney Afrika", flag: "https://flagcdn.com/w320/za.png" },
            { name: "Endonezya", flag: "https://flagcdn.com/w320/id.png" }
        ];

        let score = 0;
        let totalQuestions = 0;
        let currentCountry;
        let gameActive = true;

        const flagElement = document.getElementById('flag');
        const optionsElement = document.getElementById('options');
        const feedbackElement = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const scoreElement = document.getElementById('score');
        const totalElement = document.getElementById('total');

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function getRandomOptions(correctCountry) {
            const options = [correctCountry];
            const otherCountries = countries.filter(c => c.name !== correctCountry.name);
            const shuffled = shuffle(otherCountries);
            
            for (let i = 0; i < 3 && i < shuffled.length; i++) {
                options.push(shuffled[i]);
            }
            
            return shuffle(options);
        }

        function loadQuestion() {
            feedbackElement.textContent = '';
            feedbackElement.className = 'feedback';
            nextBtn.disabled = true;
            
            currentCountry = countries[Math.floor(Math.random() * countries.length)];
            flagElement.innerHTML = `<img src="${currentCountry.flag}" alt="${currentCountry.name}" class="flag">`;
            
            const options = getRandomOptions(currentCountry);
            optionsElement.innerHTML = '';
            
            options.forEach(country => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = country.name;
                button.addEventListener('click', () => checkAnswer(country, button));
                optionsElement.appendChild(button);
            });
            
            gameActive = true;
        }

        function checkAnswer(selectedCountry, button) {
            if (!gameActive) return;
            
            gameActive = false;
            totalQuestions++;
            totalElement.textContent = totalQuestions;
            
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(btn => btn.disabled = true);
            
            if (selectedCountry.name === currentCountry.name) {
                button.classList.add('correct');
                feedbackElement.textContent = '✓ Doğru!';
                feedbackElement.className = 'feedback correct';
                score++;
                scoreElement.textContent = score;
            } else {
                button.classList.add('wrong');
                feedbackElement.textContent = `✗ Yanlış! Doğru cevap: ${currentCountry.name}`;
                feedbackElement.className = 'feedback wrong';
                
                allButtons.forEach(btn => {
                    if (btn.textContent === currentCountry.name) {
                        btn.classList.add('correct');
                    }
                });
            }
            
            nextBtn.disabled = false;
        }

        nextBtn.addEventListener('click', loadQuestion);

        loadQuestion();
    </script>
</body>
</html>
